[dependencies.anstream]
optional = true
version = "1.0.0"

[dependencies.anstyle]
version = "1.0.14"

[dependencies.backtrace]
optional = true
version = "0.3.76"

[dependencies.clap_lex]
version = "1.0.0"

[dependencies.strsim]
optional = true
version = "0.11.1"

[dependencies.terminal_size]
optional = true
version = "0.4.4"

[dependencies.unicase]
optional = true
version = "2.9.0"

[dependencies.unicode-width]
optional = true
version = "0.2.2"

[dev-dependencies.color-print]
version = "0.3.7"

[dev-dependencies.snapbox]
version = "1.2.0"

[dev-dependencies.static_assertions]
version = "1.1.0"

[dev-dependencies.unic-emoji-char]
version = "0.9.0"

[features]
cargo = []
color = ["dep:anstream"]
debug = ["dep:backtrace"]
default = ["std", "color", "help", "usage", "error-context", "suggestions"]
deprecated = []
env = []
error-context = []
help = []
std = ["anstyle/std"]
string = []
suggestions = ["dep:strsim", "error-context"]
unicode = ["dep:unicode-width", "dep:unicase"]
unstable-doc = ["cargo", "wrap_help", "env", "unicode", "string", "unstable-ext"]
unstable-ext = []
unstable-styles = ["color"]
unstable-v5 = ["deprecated"]
usage = []
wrap_help = ["help", "dep:terminal_size"]

[lib]
path = "src/lib.rs"

[lints.clippy]
assigning_clones = "allow"
blocks_in_conditions = "allow"
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
multiple_bound_locations = "allow"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[lints.rust]
unnameable_types = "allow"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["command-line-interface"]
description = "A simple to use, efficient, and full-featured Command Line Argument Parser"
edition = "2024"
include = ["build.rs", "src/**/*", "Cargo.toml", "LICENSE*", "README.md", "examples/**/*"]
keywords = ["argument", "cli", "arg", "parser", "parse"]
license = "MIT OR Apache-2.0"
name = "clap_builder"
readme = "README.md"
repository = "https://github.com/clap-rs/clap"
resolver = "2"
rust-version = "1.85"
version = "4.6.2"

[package.metadata.docs.rs]
features = ["unstable-doc"]
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.playground]
features = ["unstable-doc"]

[package.metadata.release]
dependent-version = "upgrade"
shared-version = true
tag-name = "v{{version}}"
