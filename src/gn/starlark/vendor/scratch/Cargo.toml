[lib]
path = "src/lib.rs"

[package]
authors = ["David Tolnay <dtolnay@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["development-tools::build-utils", "filesystem"]
description = "Compile-time temporary directory shared by multiple crates and erased by `cargo clean`"
documentation = "https://docs.rs/scratch"
license = "MIT OR Apache-2.0"
name = "scratch"
readme = "README.md"
repository = "https://github.com/dtolnay/scratch"
rust-version = "1.0"
version = "1.0.9"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition", "--extern-html-root-url=core=https://doc.rust-lang.org", "--extern-html-root-url=alloc=https://doc.rust-lang.org", "--extern-html-root-url=std=https://doc.rust-lang.org"]
targets = ["x86_64-unknown-linux-gnu"]
