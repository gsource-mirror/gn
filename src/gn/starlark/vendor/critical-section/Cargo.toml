[features]
restore-state-bool = []
restore-state-none = []
restore-state-u16 = []
restore-state-u32 = []
restore-state-u64 = []
restore-state-u8 = []
restore-state-usize = []
std = ["restore-state-bool"]

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["embedded", "no-std", "concurrency"]
description = "Cross-platform critical section"
edition = "2018"
license = "MIT OR Apache-2.0"
name = "critical-section"
readme = "README.md"
repository = "https://github.com/rust-embedded/critical-section"
version = "1.2.0"
