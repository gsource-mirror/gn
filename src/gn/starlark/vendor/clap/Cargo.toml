[dependencies.clap_builder]
default-features = false
version = "=4.6.2"

[dependencies.clap_derive]
optional = true
version = "=4.6.4"

[dev-dependencies.automod]
version = "1.0.16"

[dev-dependencies.clap-cargo]
default-features = false
version = "0.15.2"

[dev-dependencies.jiff]
version = "0.2.23"

[dev-dependencies.rustversion]
version = "1.0.22"

[dev-dependencies.semver]
version = "1.0.27"

[dev-dependencies.shlex]
version = "2.0.0"

[dev-dependencies.snapbox]
features = ["term-svg"]
version = "1.2.0"

[dev-dependencies.trybuild]
version = "1.0.116"

[dev-dependencies.trycmd]
default-features = false
features = ["color-auto", "diff", "examples"]
version = "1.2.0"

[features]
cargo = ["clap_builder/cargo"]
color = ["clap_builder/color"]
debug = ["clap_builder/debug", "clap_derive?/debug"]
default = ["std", "color", "help", "usage", "error-context", "suggestions"]
deprecated = ["clap_builder/deprecated", "clap_derive?/deprecated"]
derive = ["dep:clap_derive"]
env = ["clap_builder/env"]
error-context = ["clap_builder/error-context"]
help = ["clap_builder/help"]
std = ["clap_builder/std"]
string = ["clap_builder/string"]
suggestions = ["clap_builder/suggestions"]
unicode = ["clap_builder/unicode"]
unstable-derive-ui-tests = []
unstable-doc = ["clap_builder/unstable-doc", "derive"]
unstable-ext = ["clap_builder/unstable-ext"]
unstable-markdown = ["clap_derive/unstable-markdown"]
unstable-styles = ["clap_builder/unstable-styles"]
unstable-v5 = ["clap_builder/unstable-v5", "clap_derive?/unstable-v5", "deprecated"]
usage = ["clap_builder/usage"]
wrap_help = ["clap_builder/wrap_help"]

[lib]
path = "src/lib.rs"

[lints.clippy]
assigning_clones = "allow"
blocks_in_conditions = "allow"
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
multiple_bound_locations = "allow"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[lints.rust]
unnameable_types = "allow"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["command-line-interface"]
description = "A simple to use, efficient, and full-featured Command Line Argument Parser"
edition = "2024"
include = ["build.rs", "src/**/*", "Cargo.toml", "LICENSE*", "README.md", "examples/**/*"]
keywords = ["argument", "cli", "arg", "parser", "parse"]
license = "MIT OR Apache-2.0"
name = "clap"
readme = "README.md"
repository = "https://github.com/clap-rs/clap"
resolver = "2"
rust-version = "1.85"
version = "4.6.4"

[package.metadata.docs.rs]
features = ["unstable-doc"]
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.playground]
features = ["unstable-doc"]

[package.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{version}}"
search = "Unreleased"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = "...{{tag_name}}"
search = '\.\.\.HEAD'

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{date}}"
search = "ReleaseDate"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = """
<!-- next-header -->
## [Unreleased] - ReleaseDate
"""
search = "<!-- next-header -->"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = """
<!-- next-url -->
[Unreleased]: https://github.com/clap-rs/clap/compare/{{tag_name}}...HEAD"""
search = "<!-- next-url -->"

[[package.metadata.release.pre-release-replacements]]
file = "CITATION.cff"
replace = "date-released: {{date}}"
search = "^date-released: ....-..-.."

[[package.metadata.release.pre-release-replacements]]
file = "CITATION.cff"
replace = "version: {{version}}"
search = '^version: .+\..+\..+'

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "src/lib.rs"
replace = "blob/v{{version}}/CHANGELOG.md"
search = 'blob/v.+\..+\..+/CHANGELOG.md'

[profile.bench]
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[profile.test]
opt-level = 1
